<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-label="抖音净播 设置面板示意：功能分项开关与左侧导航逐项保留">
  <title>抖音净播 · 设置面板示意</title>
  <desc>设置面板包含自动最高清晰度、广告与带货过滤、失焦自动暂停的独立开关；左侧导航可选择整条隐藏、自定义保留或保持原样，自定义时可以只保留「我的」。</desc>

  <defs>
    <style>
      .t { font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
      .h1 { font-size: 26px; font-weight: 700; fill: #e6edf3; }
      .h2 { font-size: 15px; font-weight: 700; fill: #e6edf3; }
      .body { font-size: 11.5px; fill: #8b949e; }
      .label { font-size: 10.5px; font-weight: 700; fill: #6b6f7a; }
      .title { font-size: 13px; font-weight: 600; fill: #161823; }
      .desc { font-size: 9.5px; fill: #6b6f7a; }
      .chip { font-size: 10px; fill: #161823; }
      .hint { font-size: 8.8px; fill: #6b6f7a; }
      .small { font-size: 9.5px; fill: #8b949e; }
      .num { font-size: 10px; font-weight: 700; fill: #0e1116; }
      .tag { font-size: 12px; fill: #25f4ee; }
      .accent { fill: #fe2c55; }
      .chipbox { fill: #ffffff; stroke: #ececf1; stroke-width: 1; }
      .cb { fill: #ffffff; stroke: #cfd2dc; stroke-width: 1; }
    </style>
    <clipPath id="pop">
      <rect x="40" y="30" width="380" height="640" rx="14"/>
    </clipPath>
  </defs>

  <rect width="900" height="700" fill="#0e1116"/>

  <!-- ============ 设置面板 ============ -->
  <g clip-path="url(#pop)">
    <rect x="40" y="30" width="380" height="640" fill="#ffffff"/>

    <!-- 顶部 -->
    <rect x="40" y="30" width="380" height="78" fill="#121218"/>
    <rect x="58" y="48" width="34" height="34" rx="9" fill="#25f4ee"/>
    <path d="M71 57 l11 8 -11 8 z" fill="#0e1116"/>
    <text class="t" x="104" y="67" font-size="16" font-weight="700" fill="#ffffff">抖音净播</text>
    <text class="t" x="186" y="67" font-size="10" fill="#25f4ee">v1.6.1</text>
    <text class="t" x="104" y="86" font-size="9.5" fill="#9aa0aa">已连接当前抖音页面</text>

    <!-- 功能 -->
    <text class="t label" x="60" y="136">功能</text>

    <text class="t title" x="60" y="160">自动最高清晰度</text>
    <text class="t desc" x="60" y="176">每条视频切到可用最高档，有 4K 就上 4K</text>
    <rect x="364" y="152" width="36" height="20" rx="10" class="accent"/>
    <circle cx="390" cy="162" r="8" fill="#ffffff"/>

    <text class="t title" x="60" y="204">广告 / 带货过滤</text>
    <text class="t desc" x="60" y="220">识别商品卡与店铺账号，直播不跳过</text>
    <rect x="364" y="196" width="36" height="20" rx="10" class="accent"/>
    <circle cx="390" cy="206" r="8" fill="#ffffff"/>

    <text class="t title" x="60" y="248">失焦自动暂停</text>
    <text class="t desc" x="60" y="264">切到后台暂停，回到页面不自动恢复</text>
    <rect x="364" y="240" width="36" height="20" rx="10" class="accent"/>
    <circle cx="390" cy="250" r="8" fill="#ffffff"/>

    <!-- 左侧导航 -->
    <text class="t label" x="60" y="302">布局精简 · 左侧导航</text>
    <rect x="60" y="314" width="340" height="34" rx="9" fill="#f6f6f9"/>
    <rect x="174" y="317" width="112" height="28" rx="7" fill="#ffffff" stroke="#ececf1"/>
    <text class="t" x="115" y="336" font-size="10.5" fill="#6b6f7a" text-anchor="middle">整条隐藏</text>
    <text class="t" x="230" y="336" font-size="10.5" font-weight="600" fill="#161823" text-anchor="middle">自定义保留</text>
    <text class="t" x="342" y="336" font-size="10.5" fill="#6b6f7a" text-anchor="middle">保持原样</text>

    <rect x="60" y="358" width="340" height="148" rx="10" fill="#fcfcfe" stroke="#ececf1"/>
    <text class="t hint" x="72" y="380">勾选要保留的入口，其余隐藏</text>
    <text class="t hint" x="388" y="380" fill="#fe2c55" text-anchor="end">仅保留「我的」</text>

    <!-- 第一排 chip -->
    <rect x="72" y="392" width="48" height="22" rx="11" class="chipbox"/>
    <rect x="79" y="398" width="10" height="10" rx="2.5" class="cb"/>
    <text class="t chip" x="94" y="407">精选</text>

    <rect x="126" y="392" width="48" height="22" rx="11" class="chipbox"/>
    <rect x="133" y="398" width="10" height="10" rx="2.5" class="cb"/>
    <text class="t chip" x="148" y="407">推荐</text>

    <rect x="180" y="392" width="62" height="22" rx="11" class="chipbox"/>
    <rect x="187" y="398" width="10" height="10" rx="2.5" class="cb"/>
    <text class="t chip" x="202" y="407">AI抖音</text>

    <rect x="248" y="392" width="48" height="22" rx="11" class="chipbox"/>
    <rect x="255" y="398" width="10" height="10" rx="2.5" class="cb"/>
    <text class="t chip" x="270" y="407">关注</text>

    <rect x="302" y="392" width="48" height="22" rx="11" class="chipbox"/>
    <rect x="309" y="398" width="10" height="10" rx="2.5" class="cb"/>
    <text class="t chip" x="324" y="407">朋友</text>

    <!-- 第二排 chip，保留「我的」 -->
    <rect x="72" y="420" width="50" height="22" rx="11" fill="#fff0f3" stroke="#fe2c55"/>
    <rect x="79" y="426" width="10" height="10" rx="2.5" fill="#fe2c55"/>
    <path d="M81.5 431 l2.2 2.2 4.3 -4.6" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t chip" x="94" y="435">我的</text>

    <rect x="128" y="420" width="50" height="22" rx="11" class="chipbox"/>
    <rect x="135" y="426" width="10" height="10" rx="2.5" class="cb"/>
    <text class="t chip" x="150" y="435">直播</text>

    <rect x="184" y="420" width="62" height="22" rx="11" class="chipbox"/>
    <rect x="191" y="426" width="10" height="10" rx="2.5" class="cb"/>
    <text class="t chip" x="206" y="435">放映厅</text>

    <rect x="252" y="420" width="50" height="22" rx="11" class="chipbox"/>
    <rect x="259" y="426" width="10" height="10" rx="2.5" class="cb"/>
    <text class="t chip" x="274" y="435">短剧</text>

    <rect x="308" y="420" width="58" height="22" rx="11" class="chipbox"/>
    <rect x="315" y="426" width="10" height="10" rx="2.5" class="cb"/>
    <text class="t chip" x="330" y="435">小游戏</text>

    <text class="t hint" x="72" y="474">未勾选的入口会被隐藏；一个都不勾选时整条导航隐藏。</text>

    <!-- 其他布局 -->
    <text class="t label" x="60" y="530">布局精简 · 其他</text>

    <text class="t title" x="60" y="552">顶栏图标精简</text>
    <text class="t desc" x="60" y="568">右上角只留头像、通知、消息</text>
    <rect x="364" y="544" width="36" height="20" rx="10" class="accent"/>
    <circle cx="390" cy="554" r="8" fill="#ffffff"/>

    <text class="t title" x="60" y="596">浮层自动隐藏</text>
    <text class="t desc" x="60" y="612">标题与互动栏静止 2 秒后淡出</text>
    <rect x="364" y="588" width="36" height="20" rx="10" class="accent"/>
    <circle cx="390" cy="598" r="8" fill="#ffffff"/>

    <!-- 底栏 -->
    <line x1="60" y1="630" x2="400" y2="630" stroke="#ececf1"/>
    <rect x="60" y="640" width="66" height="24" rx="7" fill="#ffffff" stroke="#ececf1"/>
    <text class="t" x="93" y="656" font-size="10.5" fill="#161823" text-anchor="middle">恢复默认</text>
    <text class="t small" x="388" y="656" text-anchor="end">Alt + Shift + D 调试</text>
  </g>
  <rect x="40.5" y="30.5" width="379" height="639" rx="14" fill="none" stroke="#2b313b"/>

  <!-- ============ 右侧说明 ============ -->
  <text class="t h1" x="470" y="92">设置面板</text>
  <text class="t body" x="470" y="120">点工具栏图标打开，改动即时生效</text>
  <rect x="470" y="136" width="56" height="3" fill="#fe2c55"/>
  <text class="t tag" x="860" y="60" text-anchor="end">v1.6.1</text>

  <circle cx="486" cy="180" r="10" fill="#25f4ee"/>
  <text class="t num" x="486" y="184" text-anchor="middle">1</text>
  <text class="t h2" x="506" y="176">功能分项开关</text>
  <text class="t body" x="506" y="197">清晰度 / 过滤 / 暂停可以单独关闭</text>

  <circle cx="486" cy="266" r="10" fill="#25f4ee"/>
  <text class="t num" x="486" y="270" text-anchor="middle">2</text>
  <text class="t h2" x="506" y="262">左侧导航逐项保留</text>
  <text class="t body" x="506" y="283">例如只留「我的」，其余入口、</text>
  <text class="t body" x="506" y="301">推广与备案页脚一起隐藏</text>

  <circle cx="486" cy="356" r="10" fill="#25f4ee"/>
  <text class="t num" x="486" y="360" text-anchor="middle">3</text>
  <text class="t h2" x="506" y="352">布局其他部分</text>
  <text class="t body" x="506" y="373">顶栏精简、浮层自动隐藏各自开关</text>

  <circle cx="486" cy="426" r="10" fill="#25f4ee"/>
  <text class="t num" x="486" y="430" text-anchor="middle">4</text>
  <text class="t h2" x="506" y="422">跨设备同步</text>
  <text class="t body" x="506" y="443">设置存 chrome.storage.sync，</text>
  <text class="t body" x="506" y="461">登录同一 Chrome 账号自动同步</text>

  <rect x="470" y="498" width="390" height="104" rx="12" fill="#16191f" stroke="#2b313b"/>
  <text class="t" x="490" y="526" font-size="12" font-weight="700" fill="#25f4ee">默认值 = 旧版行为</text>
  <text class="t body" x="490" y="548">导航整条隐藏、功能全开；升级不改变老用户观感。</text>
  <text class="t body" x="490" y="568">想只留「我的」，点一下预设即可。</text>
  <text class="t tag" x="490" y="590">所有开关即时生效，无需刷新页面</text>

  <text class="t tag" x="470" y="660">功能与布局都能单独开关 · 设置跨设备同步</text>
</svg>
