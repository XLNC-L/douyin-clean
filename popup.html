<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>抖音净播</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <img class="logo" src="icons/icon48.png" alt="">
        <div class="brand-text">
          <span class="name">抖音净播</span>
          <span id="ver" class="ver"></span>
        </div>
      </div>
      <a id="repoLink" class="icon-btn" href="https://github.com/XLNC-L/douyin-clean" target="_blank" rel="noopener" title="GitHub 仓库" aria-label="打开 GitHub 仓库">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
    </div>
    <div class="status">
      <i class="dot"></i>
      <span id="status">正在读取当前页面…</span>
    </div>
  </header>

  <main class="stack">
    <section class="card">
      <h2>播放</h2>
      <label class="row">
        <span class="row-main">
          <span class="row-title">自动最高清晰度</span>
          <span class="row-desc">每条视频切到可用最高档，有 4K 就上 4K</span>
        </span>
        <input class="switch" type="checkbox" data-key="quality">
      </label>
      <label class="row">
        <span class="row-main">
          <span class="row-title">失焦自动暂停</span>
          <span class="row-desc">切到后台时暂停，回到页面不自动续播</span>
        </span>
        <input class="switch" type="checkbox" data-key="pause">
      </label>
      <label class="row">
        <span class="row-main">
          <span class="row-title">屏蔽双击点赞</span>
          <span class="row-desc">双击画面不再点赞，单击暂停等操作不受影响</span>
        </span>
        <input class="switch" type="checkbox" data-key="noDoubleLike">
      </label>
      <label class="row">
        <span class="row-main">
          <span class="row-title">底部进度细线</span>
          <span class="row-desc">视频底边常驻一条细线，直播不显示</span>
        </span>
        <input class="switch" type="checkbox" data-key="progress">
      </label>
      <div id="progressStyle" class="fold" hidden>
        <div class="fold-head">
          <span>线条颜色</span>
          <span id="progressHex" class="hex">#FE2C55</span>
        </div>
        <div class="color-line">
          <label class="color-pick" title="自定义颜色">
            <input id="progressColor" class="color-input" type="color" value="#fe2c55" aria-label="自定义进度条颜色">
          </label>
          <div id="colorPresets" class="presets">
            <button class="swatch" type="button" data-color="#fe2c55" style="--sw:#fe2c55" title="抖音红" aria-label="抖音红"></button>
            <button class="swatch" type="button" data-color="#25f4ee" style="--sw:#25f4ee" title="青色" aria-label="青色"></button>
            <button class="swatch" type="button" data-color="#00e676" style="--sw:#00e676" title="绿色" aria-label="绿色"></button>
            <button class="swatch" type="button" data-color="#ffd400" style="--sw:#ffd400" title="黄色" aria-label="黄色"></button>
            <button class="swatch" type="button" data-color="#a855f7" style="--sw:#a855f7" title="紫色" aria-label="紫色"></button>
            <button class="swatch" type="button" data-color="#ffffff" style="--sw:#ffffff" title="白色" aria-label="白色"></button>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>过滤</h2>
      <label class="row">
        <span class="row-main">
          <span class="row-title">广告 / 带货过滤</span>
          <span class="row-desc">识别商品卡与店铺账号并切下一条</span>
        </span>
        <input class="switch" type="checkbox" data-key="filter">
      </label>
      <label class="row">
        <span class="row-main">
          <span class="row-title">直播过滤</span>
          <span class="row-desc">推荐流里的直播间自动切到下一条</span>
        </span>
        <input class="switch" type="checkbox" data-key="live">
      </label>
    </section>

    <section class="card">
      <h2>界面</h2>
      <label class="row">
        <span class="row-main">
          <span class="row-title">浮层自动隐藏</span>
          <span class="row-desc">标题与互动栏静止 2 秒后淡出</span>
        </span>
        <input class="switch" type="checkbox" data-key="overlay">
      </label>
      <label class="row">
        <span class="row-main">
          <span class="row-title">游戏推广卡片</span>
          <span class="row-desc">隐藏左下角「游戏 XX」这类卡片，暂停时出现的也一并隐藏</span>
        </span>
        <input class="switch" type="checkbox" data-key="hideGame">
      </label>
      <label class="row">
        <span class="row-main">
          <span class="row-title">直播间精简</span>
          <span class="row-desc">按需隐藏礼物栏、榜单入口等板块</span>
        </span>
        <input class="switch" type="checkbox" data-key="liveClean">
      </label>
      <div id="liveCustom" class="fold" hidden>
        <div class="fold-head">
          <span>勾选要隐藏的板块</span>
        </div>
        <div id="liveList" class="nav-list">
          <label class="chip"><input type="checkbox" data-live-part="gifts"><span>礼物栏</span></label>
          <label class="chip"><input type="checkbox" data-live-part="ranks"><span>榜单入口</span></label>
          <label class="chip"><input type="checkbox" data-live-part="footer"><span>首页页脚</span></label>
          <label class="chip"><input type="checkbox" data-live-part="promo"><span>下载引导</span></label>
          <label class="chip"><input type="checkbox" data-live-part="head"><span>顶栏推广</span></label>
        </div>
        <p class="hint">右侧聊天区、观众榜、主播信息条与播放器控制始终保留。</p>
      </div>
    </section>

    <section class="card">
      <h2>左侧导航</h2>
      <div class="seg" role="radiogroup" aria-label="左侧导航模式">
        <label><input type="radio" name="navMode" value="hide"><span>整条隐藏</span></label>
        <label><input type="radio" name="navMode" value="custom"><span>自定义保留</span></label>
        <label><input type="radio" name="navMode" value="off"><span>保持原样</span></label>
      </div>
      <div id="navCustom" class="fold" hidden>
        <div class="fold-head">
          <span>勾选要保留的板块，其余隐藏</span>
          <button id="onlyMine" class="link-btn" type="button">仅保留「我的」</button>
        </div>
        <div id="navList" class="nav-list"></div>
        <p id="navHint" class="hint"></p>
      </div>
    </section>

    <section class="card">
      <h2>顶栏</h2>
      <label class="row">
        <span class="row-main">
          <span class="row-title">顶栏精简</span>
          <span class="row-desc">只留勾选的图标与头像，其余隐藏</span>
        </span>
        <input id="headerSimple" class="switch" type="checkbox">
      </label>
      <div id="headerCustom" class="fold" hidden>
        <div class="fold-head">
          <span>勾选要保留的图标，头像始终保留</span>
          <button id="headerDefaults" class="link-btn" type="button">恢复推荐</button>
        </div>
        <div id="headerList" class="nav-list"></div>
        <p id="headerHint" class="hint"></p>
      </div>
    </section>

    <section class="card">
      <h2>手动屏蔽</h2>
      <div class="row row-static">
        <span class="row-main">
          <span class="row-title">屏蔽规则</span>
          <span class="row-desc" id="ruleDesc">读取中…</span>
        </span>
        <button id="clearRules" class="link-btn" type="button">清空</button>
      </div>
      <p class="hint">刷视频时按 Alt + Shift + X 屏蔽当前视频的话题 / 作者，之后同类视频自动跳过；再按一次取消。</p>
    </section>
  </main>

  <footer class="foot">
    <button id="reset" class="ghost" type="button">恢复默认</button>
    <span class="foot-note">改动即时生效，无需刷新</span>
  </footer>

  <div id="toast" class="toast" hidden>已保存</div>

  <script src="js/defaults.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
