name: Release

# 推送 v* 标签即自动打包扩展并发布 Release：
#   git tag v1.3.9 && git push origin v1.3.9
# Release 说明取自仓库里的 .github/release-notes.md（发版前手工写明本次改动），
# 该文件不存在时才退回按提交记录自动生成。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验标签与 manifest 版本
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 manifest.json 的 ${VERSION} 不一致"
            exit 1
          fi
          echo "版本一致：${VERSION}"

      - name: 静态校验
        run: node scripts/check.mjs

      - name: 打包扩展
        run: |
          NAME="douyin-clean-${GITHUB_REF_NAME}"
          # manifest.json 必须在压缩包根目录，Chrome 才能直接加载
          zip -r "${NAME}.zip" manifest.json popup.html css js icons docs README.md LICENSE
          ls -lh "${NAME}.zip"

      - name: 准备 Release 说明
        run: |
          if [ -f .github/release-notes.md ]; then
            cp .github/release-notes.md notes.md
            echo "使用 .github/release-notes.md"
          else
            echo "本次发布没有单独写说明，改动见提交记录。" > notes.md
          fi
          cat notes.md

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 幂等：改写提交历史后重推标签、或误重推标签时，Release 已经存在，
          # 这里直接跳过，避免整条流程报红（以前会在 gh release create 处直接失败）。
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在，跳过创建"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" "douyin-clean-${GITHUB_REF_NAME}.zip" \
            --title "抖音净播 ${GITHUB_REF_NAME}" \
            --notes-file notes.md
