name: Release

# 推送 v* 标签即自动打包扩展并发布 Release：
#   git tag v1.3.8 && git push origin v1.3.8
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 打包扩展
        run: |
          NAME="douyin-clean-${GITHUB_REF_NAME}"
          # manifest.json 必须在压缩包根目录，Chrome 才能直接加载
          zip -r "${NAME}.zip" manifest.json css js icons README.md LICENSE
          ls -lh "${NAME}.zip"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "douyin-clean-${GITHUB_REF_NAME}.zip" \
            --title "抖音净播 ${GITHUB_REF_NAME}" \
            --generate-notes
